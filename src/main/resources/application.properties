quarkus.package.type=fast-jar

# ===== Configuration nœud et cluster =====
# Identifiant du nœud local (à modifier sur chaque PC: node1, node2 ou node3)
memorydb.node.id=node1

# Adresse du nœud local (à modifier sur chaque PC avec l'IP correcte)
# Format: IP:PORT
memorydb.node.hostname=192.168.1.101:8080

# Activation du mode cluster
memorydb.cluster.enabled=true

# Liste des adresses de tous les nœuds du cluster
# Cette liste doit être identique sur tous les nœuds
memorydb.cluster.nodes=192.168.1.101:8080,192.168.1.102:8080,192.168.1.103:8080

# Port du serveur HTTP (8080 par défaut, à ajuster si besoin)
quarkus.http.port=8080

# ===== Netty timeouts pour résoudre ReadTimeoutException =====
# Augmenter le timeout de lecture pour les requêtes HTTP
quarkus.http.read-timeout=5m

# Configurer les timeouts Netty
quarkus.vertx.eventloop.worker-pool-size=20
quarkus.http.idle-timeout=300s
quarkus.http.so-timeout=300s
quarkus.thread-pool.max-threads=50
quarkus.vertx.worker-pool-size=50

# Augmenter la taille du buffer pour les requêtes
quarkus.http.body.uploads-directory=uploads
quarkus.http.body.handle-file-uploads=true
quarkus.http.limits.max-body-size=1G

# Configurer le serveur pour les réponses lentes
quarkus.resteasy.async-supported=true
quarkus.http.enable-compression=true

# ===== Configuration distribuée pour optimiser la mémoire =====
# Taille du batch pour le chargement des fichiers Parquet (ajuster selon la RAM disponible)
memorydb.parquet.batch-size=5000

# Nombre de threads pour le chargement parallèle
memorydb.parquet.parallelism=4

# Stratégie de distribution: round-robin
memorydb.distribution.strategy=round-robin

# Logs détaillés de la distribution
memorydb.distribution.verbose-logging=true

# ===== EXTREME JVM Performance Optimizations =====
# Ultra-fast JVM settings for maximum throughput and minimal latency
quarkus.native.additional-build-args=-H:+UnlockExperimentalVMOptions,-H:+UseG1GC,-H:MaxGCPauseMillis=10,-H:G1HeapRegionSize=32m

# Extreme memory settings for large datasets (16GB heap + off-heap)
quarkus.jvm.args=-Xms8g,-Xmx16g,-XX:MaxDirectMemorySize=32g,-XX:+UseG1GC,-XX:MaxGCPauseMillis=10,-XX:G1HeapRegionSize=32m,-XX:+UseStringDeduplication,-XX:+OptimizeStringConcat,-XX:+UseFastAccessorMethods,-XX:+AggressiveOpts,-XX:+UseBiasedLocking,-XX:BiasedLockingStartupDelay=0,-XX:+EliminateLocks,-XX:+DoEscapeAnalysis,-XX:+UseCompressedOops,-XX:+UseCompressedClassPointers,-XX:+AlwaysPreTouch,-XX:+UseLargePages,-XX:LargePageSizeInBytes=2m,-XX:+UseTransparentHugePages,-Djava.awt.headless=true,-Dfile.encoding=UTF-8,-Dio.netty.allocator.type=pooled,-Dio.netty.allocator.directMemoryCacheAlignment=64

# Extreme Network and I/O optimizations
quarkus.http.io-threads=16
quarkus.vertx.eventloop-pool-size=16
quarkus.vertx.worker-pool-size=128
quarkus.thread-pool.core-threads=64
quarkus.thread-pool.max-threads=256
quarkus.vertx.prefer-native-transport=true

# HTTP optimizations for binary transfers
quarkus.http.enable-compression=false
quarkus.http.compress-media-types=
quarkus.http.compression-level=0

# ===== EXTREME Ultra-Fast Binary Protocol Settings =====
# Massive batch sizes for maximum throughput
memorydb.parquet.batch-size=2000000
memorydb.parquet.parallelism=16
memorydb.binary.compression-threshold=32768
memorydb.binary.buffer-size=67108864
memorydb.offheap.enabled=true
memorydb.disruptor.enabled=true
memorydb.kryo.enabled=true
memorydb.chronicle.enabled=true

# ===== Off-Heap Storage Settings =====
memorydb.offheap.initial-size=1073741824
memorydb.offheap.max-size=34359738368
memorydb.chronicle.entries=100000000

# ===== LMAX Disruptor Settings =====
memorydb.disruptor.ring-buffer-size=2097152
memorydb.disruptor.wait-strategy=yielding
